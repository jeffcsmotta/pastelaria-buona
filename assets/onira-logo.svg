<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Playfair+Display:ital,wght@1,600;1,700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
            .onira-brand {
                font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
                font-weight: 900;
                font-size: 82px;
                fill: #FFFFFF;
                letter-spacing: -2px;
            }
            .labs-brand {
                font-family: 'Playfair Display', 'Georgia', serif;
                font-weight: 700;
                font-style: italic;
                font-size: 96px;
                fill: #FFFFFF;
                letter-spacing: 0px;
            }
            .tagline {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-weight: 700;
                font-size: 16px;
                fill: #E2E8F0;
                letter-spacing: 1.5px;
            }
        </style>
    </defs>
    
    <!-- Transparent Background -->
    <rect width="100%" height="100%" fill="transparent" />

    <!-- ONIRA LABS Text -->
    <g transform="translate(30, 85)">
        <text x="0" y="0" class="onira-brand">onira</text>
        <text x="210" y="0" class="labs-brand">labs</text>
    </g>

    <!-- Tagline Subtitle -->
    <text x="32" y="125" class="tagline">Service Design + Rapid Prototyping + Human-in-the-Loop</text>
</svg>
